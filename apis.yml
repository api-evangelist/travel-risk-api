aid: travel-risk-api
name: Travel Risk API
image: https://travelriskapi.com/og/home.png?lang=en
description: 'Travel Risk API by Travel Code is a REST API for real-time travel safety
  data: government travel advisories, natural disaster alerts, armed-conflict events
  and composite country risk scores for 229 countries and territories, plus a companion
  Aviation API covering airport status, security, immigration, weather and flight
  data. One API key opens both; a free plan needs no card, and a hosted MCP server
  exposes 15 tools.'
