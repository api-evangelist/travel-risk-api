        ?since= ISO-8601 or unix seconds (default: last 7 days); ?iata= one airline; ?field= one column

        (e.g. iosa_expiry); _limit 1..5000. Rows are ordered oldest-first so a client can checkpoint on the

        last `changed_at`. Values are text; NULL = absent before/after.'
      operationId: airline_changes_ext_v1_airline_changes_get
      parameters:
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
