  /adb/flights/number/{number}/{date}:
    get:
      summary: Adb Flights/Number/Date
      description: 'Flight legs for a flight number on a date (local date, YYYY-MM-DD).


        `withAircraftImage=true` adds `aircraft.image` when a photo of the aircraft exists: `url` (image), `author`,

        `webUrl` (photo page) and ready-made `htmlAttributions`. Photo licence conditions apply to your product:

        show the photographer credit as visible text next to the image, make the image link to `webUrl` with a plain

        link (no rel="nofollow"), and do not make photos a paid-only or members-only feature.'
